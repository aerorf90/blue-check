<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RynWeb PC Check</title><link rel="icon" href="/logo.png"><style>
:root{--bg:#040b1c;--panel:#071530;--line:#133472;--p:#1e6bff;--p2:#4da3ff;--t:#eaf2ff;--mut:#8fa6d6;--bad:#ff5d5d;--warn:#ffb84d;--ok:#35e08a}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(circle at 70% 0,#0b2a66,var(--bg) 55%);color:var(--t);min-height:100vh;padding:20px}
.w{max-width:960px;margin:auto}.logo{font-size:24px;font-weight:800;margin-bottom:18px}.logo b{color:var(--p2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
input,button{font-size:14px;border-radius:10px;border:1px solid var(--line);padding:11px 14px;background:#0a1b3d;color:var(--t)}
button{background:linear-gradient(90deg,var(--p),#0f4fd6);border:0;cursor:pointer}.g{background:#123a80}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600}
tr.c{cursor:pointer}tr.c:hover{background:#0a1b3d}
.b{padding:3px 9px;border-radius:20px;font-size:11px}.bad{background:#3a1420;color:var(--bad)}.warn{background:#3a2a10;color:var(--warn)}.ok{background:#0f3a28;color:var(--ok)}.wait{background:#123a80;color:var(--p2)}.off{background:#222;color:#999}
.f{padding:9px 12px;border-radius:8px;margin-top:6px;font-size:12px;border-left:4px solid}.f b{display:block;font-size:11px;margin-bottom:2px}
.high{background:#2a1020;border-color:var(--bad)}.medium{background:#2a2010;border-color:var(--warn)}.info{background:#0a1b3d;border-color:var(--p)}
.hide{display:none}.code{font-size:26px;letter-spacing:4px;font-weight:700}
</style></head><body><div class="w">
<div class="logo"><img src="/logo.png" style="height:40px;vertical-align:middle;margin-right:8px">RynWeb PC Check</div>
<div class="card" id="login"><h3 style="margin-bottom:10px">Connexion</h3><div class="row">
 <input id="key" placeholder="PCK-XXXX-XXXX-XXXX" style="width:260px"><button onclick="login()">Se connecter</button></div><p class="mut" id="err" style="margin-top:8px;color:var(--bad)"></p></div>
<div id="app" class="hide">
 <div class="card"><div class="row"><input id="pl" placeholder="Nom du joueur (optionnel)"><button onclick="newCheck()">Nouveau check</button>
  <span class="code" id="code"></span><span class="sp" style="flex:1"></span><span class="mut" id="exp"></span><button class="g" onclick="location.href='/download'">Page de téléchargement</button><button class="g" onclick="logout()">Déconnexion</button></div>
  <p class="mut" style="margin-top:8px">Envoyez au joueur le lien <b id="dl"></b> et le code : il télécharge l'application puis saisit le code. Le code est valable 24 h.</p></div>
 <div class="card"><table><thead><tr><th>Code</th><th>Joueur</th><th>Date</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div>
 <div class="card hide" id="det"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);let K=localStorage.getItem('pck')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=(p,o={})=>fetch(p,{...o,headers:{'Content-Type':'application/json','x-owner-key':K}}).then(r=>r.json());
async function login(){K=$('key').value.trim().toUpperCase();const j=await api('/owner/login',{method:'POST'});
 if(j.ok){localStorage.setItem('pck',K);show()}else $('err').textContent=j.error||'Clé invalide'}
function logout(){localStorage.removeItem('pck');location.reload()}
async function newCheck(){const j=await api('/owner/check/new',{method:'POST',body:JSON.stringify({player:$('pl').value})});$('code').textContent=j.code||'';$('pl').value='';refresh()}
function badge(c){if(!c.done)return c.expired?'<span class="b off">Expiré</span>':'<span class="b wait">En attente</span>';
 return c.stats.high?`<span class="b bad">${c.stats.high} suspect(s)</span>`:c.stats.medium?`<span class="b warn">${c.stats.medium} à vérifier</span>`:'<span class="b ok">Propre</span>'}
async function refresh(){const j=await api('/owner/checks');if(j.error){logout();return}
 $('exp').textContent='Abonnement jusqu\'au '+new Date(j.expiresAt).toLocaleDateString();
 $('rows').innerHTML=j.checks.map(c=>`<tr class="c" onclick="open_('${esc(c.code)}')"><td>${esc(c.code)}</td><td>${esc(c.player)||'—'}</td><td>${new Date(c.createdAt).toLocaleString()}</td><td>${badge(c)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">Aucun check pour le moment.</td></tr>'}
async function open_(code){const j=await api('/owner/check/'+code);const d=$('det');d.classList.remove('hide');
 if(!j.report){d.innerHTML='<p class="mut">En attente du joueur…</p>';return}const r=j.report;
 d.innerHTML=`<h3>Rapport ${esc(code)} ${j.player?'— '+esc(j.player):''}</h3><p class="mut">PC : ${esc(r.hostname)} · HWID : ${esc(r.hwid)} · ${esc(r.scannedAt)}</p>`+
 (r.findings.length?r.findings.map(f=>`<div class="f ${['high','medium','info'].includes(f.severity)?f.severity:'info'}"><b>${esc(f.category)}</b>${esc(f.detail)}</div>`).join(''):'<p class="mut" style="margin-top:8px">Rien à signaler.</p>')}
function show(){$('dl').textContent=location.origin+'/download';$('login').classList.add('hide');$('app').classList.remove('hide');refresh();setInterval(refresh,5000)}
if(K){api('/owner/login',{method:'POST'}).then(j=>j.ok?show():localStorage.removeItem('pck'))}
</script></body></html>
