<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendeur — Blue Detected</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css">
<style>.p{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}label{font-size:13px;color:var(--mut)}
pre{background:rgba(3,14,60,.7);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;font:13px Consolas,monospace;min-height:60px}h1{font-size:26px;margin:36px 0 4px}</style></head>
<body class="glow"><nav class="nav"><div class="wrap"><a class="logo" href="/"><img src="/logo.png" alt="">Blue Detected</a><span class="sp"></span><span class="mut" style="font-size:13px">Espace vendeur</span></div></nav>
<main class="wrap"><h1>Clés d'abonnement</h1><p class="mut">Générez, désactivez ou déliez les clés de vos clients.</p>
<div class="p"><label>Mot de passe vendeur</label><div class="r"><input id="t" type="password" placeholder="ADMIN_TOKEN" style="width:260px"></div></div>
<div class="p"><b>Générer des clés</b><div class="r"><label>Durée (jours)</label><input id="d" value="30" size="4"><label>Nombre</label><input id="c" value="1" size="3"><label>Client</label><input id="l" placeholder="Nom du client"><button class="btn" onclick="mk()">Générer</button><button class="btn ghost" onclick="ls()">Voir toutes les clés</button></div></div>
<div class="p"><b>Gérer une clé</b><div class="r"><input id="k" size="24" placeholder="PCK-XXXX-XXXX-XXXX"><button class="btn ghost" onclick="act('revoke')">Désactiver</button><button class="btn ghost" onclick="act('unbind')">Délier du compte Discord</button></div></div>
<pre id="o"></pre></main>
<script>
const H=()=>({'Content-Type':'application/json','x-admin-token':t.value});
async function mk(){const r=await fetch('/seller/create',{method:'POST',headers:H(),body:JSON.stringify({days:d.value,count:c.value,label:l.value})});const j=await r.json();o.textContent=j.keys?j.keys.join('\n'):JSON.stringify(j)}
async function ls(){const r=await fetch('/seller/list',{headers:H()});const j=await r.json();
 o.textContent=Array.isArray(j)?j.map(x=>x.key+' | '+x.days+' j | '+(x.label||'-')+' | '+(x.revoked?'DÉSACTIVÉE':x.expiresAt?'expire le '+new Date(x.expiresAt).toLocaleDateString():'non activée')+' | Discord : '+(x.ownerName||'-')+' | '+x.checks+' checks').join('\n'):JSON.stringify(j)}
async function act(a){const r=await fetch('/seller/'+a,{method:'POST',headers:H(),body:JSON.stringify({key:k.value.trim().toUpperCase()})});o.textContent=JSON.stringify(await r.json())}
</script></body></html>
